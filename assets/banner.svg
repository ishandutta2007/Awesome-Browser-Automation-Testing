<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.65" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.8" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    .code-pill {
      font-family: "SF Mono", Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      fill: #38bdf8;
    }

    /* Ambient dynamic animations in the background */
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    @keyframes pulseCheck {
      0%, 100% { r: 5px; opacity: 0.7; }
      50% { r: 8px; opacity: 1; }
    }
    @keyframes streamData {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }

    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out 1.5s infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out 0.8s infinite; }
    .pulse-layer { animation: pulseGlow 4s ease-in-out infinite; }
    .stream-line {
      stroke-dasharray: 20 10;
      animation: streamData 8s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Ambient Animated Glow Orbs in Background -->
  <circle cx="150" cy="70" r="130" fill="#3b82f6" opacity="0.12" filter="url(#glow)" class="pulse-layer" />
  <circle cx="1060" cy="180" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="pulse-layer" />
  <circle cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.1" filter="url(#glow)" class="pulse-layer" />

  <!-- Dynamic Animated Signal Flow lines behind content -->
  <path d="M 50 280 C 350 280, 450 310, 800 290 C 1000 275, 1100 230, 1150 200" fill="none" stroke="url(#accentCyan)" stroke-width="2" opacity="0.4" class="stream-line" />
  <path d="M 50 60 C 300 40, 500 90, 850 50 C 1000 35, 1120 70, 1150 100" fill="none" stroke="url(#accentPurple)" stroke-width="2" opacity="0.35" class="stream-line" />

  <!-- Dynamic Floating Decorative Status Cards (Bottom-Right / Top-Right background accents) -->
  <g class="pill-1" transform="translate(860, 50)">
    <rect width="260" height="48" rx="24" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#10b981" />
    <text x="46" y="29" class="badge-text">100% Tests Passed</text>
    <rect x="180" y="14" width="62" height="20" rx="10" fill="#065f46" />
    <text x="193" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">ACTIVE</text>
  </g>

  <g class="pill-2" transform="translate(900, 120)">
    <rect width="230" height="44" rx="22" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1.5" />
    <circle cx="26" cy="22" r="6" fill="#38bdf8" />
    <text x="44" y="27" class="badge-text">Playwright &amp; Cypress</text>
    <text x="175" y="27" class="code-pill">v2026</text>
  </g>

  <g class="pill-3" transform="translate(830, 185)">
    <rect width="280" height="48" rx="24" fill="#1e293b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="28" cy="24" r="7" fill="#a855f7" />
    <text x="48" y="29" class="badge-text">AI Self-Healing Locators</text>
    <rect x="215" y="14" width="48" height="20" rx="10" fill="#4c1d95" />
    <text x="226" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#c084fc">AUTO</text>
  </g>

  <!-- FOREGROUND: Content and Main Typography (Always Crisp and Guaranteed Clear) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Category Header -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">QA • E2E • BROWSER AUTOMATION</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="132" class="title-text">Awesome Browser Automation</text>
    <text x="0" y="178" class="title-text" fill="url(#accentCyan)">&amp; Testing Ecosystem</text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="222" class="subtitle-text">Curated guide to SaaS powerhouses, open-source frameworks &amp; AI QA agents.</text>

    <!-- Feature Pillars Badges in Foreground -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Cross-Browser</text>

      <rect x="180" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="194" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ Self-Healing</text>

      <rect x="352" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="366" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">👁️ Visual Regression</text>

      <rect x="544" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="558" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 AI-Agent QA</text>
    </g>
  </g>
</svg>
