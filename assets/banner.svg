<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="accentEmerald" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".8" d="M 40 0 L 0 0 0 40" opacity=".65"/><circle cx="40" cy="40" r="1.5" fill="#334155" opacity=".8"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes floatPill{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}@keyframes pulseGlow{0%{opacity:.35}50%{opacity:.75}}@keyframes pulseCheck{0%{r:5px;opacity:.7}50%{r:8px;opacity:1}}@keyframes streamData{0%{stroke-dashoffset:240}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#f8fafc}.code-pill{font-family:&quot;SF Mono&quot;,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace;font-size:12px;fill:#38bdf8}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPill 6s ease-in-out 1.5s infinite}.pill-3{animation:floatPill 5.5s ease-in-out .8s infinite}.pulse-layer{animation:pulseGlow 4s ease-in-out infinite}.stream-line{stroke-dasharray:20 10;animation:streamData 8s linear infinite}</style><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="340" fill="url(#grid)" rx="16"/><circle cx="150" cy="70" r="130" fill="#3b82f6" class="pulse-layer" filter="url(#glow)" opacity=".12"/><circle cx="1060" cy="180" r="160" fill="#a855f7" class="pulse-layer" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="300" r="120" fill="#06b6d4" class="pulse-layer" filter="url(#glow)" opacity=".1"/><path fill="none" stroke="url(#accentCyan)" stroke-width="2" d="M 50 280 C 350 280, 450 310, 800 290 C 1000 275, 1100 230, 1150 200" class="stream-line" opacity=".4"/><path fill="none" stroke="url(#accentPurple)" stroke-width="2" d="M 50 60 C 300 40, 500 90, 850 50 C 1000 35, 1120 70, 1150 100" class="stream-line" opacity=".35"/><g class="pill-1" transform="translate(860, 50)"><rect width="260" height="48" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1.5" rx="24"/><circle cx="28" cy="24" r="7" fill="#10b981"/><text x="46" y="29" class="badge-text">100% Tests Passed</text><rect width="62" height="20" x="180" y="14" fill="#065f46" rx="10"/><text x="193" y="28" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ACTIVE</text></g><g class="pill-2" transform="translate(900, 120)"><rect width="230" height="44" fill="#1e293b" fill-opacity=".8" stroke="#475569" stroke-width="1.5" rx="22"/><circle cx="26" cy="22" r="6" fill="#38bdf8"/><text x="44" y="27" class="badge-text">Playwright &amp; Cypress</text><text x="175" y="27" class="code-pill">v2026</text></g><g class="pill-3" transform="translate(830, 185)"><rect width="280" height="48" fill="#1e293b" fill-opacity=".8" stroke="#6366f1" stroke-width="1.5" rx="24"/><circle cx="28" cy="24